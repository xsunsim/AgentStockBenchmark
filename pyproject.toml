[project]
name = "agentstockbenchmark"
version = "0.1.7"
description = "Agent stock ranking and portfolio benchmark engine"
requires-python = ">=3.10"
dependencies = [
  "html5lib",
  "lxml",
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "yfinance",
  "mcp",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
agentstockbenchmark = "agentstockbenchmark.cli:main"
asb = "agentstockbenchmark.cli:main"
asb-mcp = "agentstockbenchmark.mcp_server.server:mcp.run"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"
